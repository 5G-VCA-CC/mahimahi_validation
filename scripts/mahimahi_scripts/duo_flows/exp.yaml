# exp.yaml (CONCURRENT classic UDP + l4s TCP)
output_dir: ./outputs

secs_per_run: 30
num_runs: 50

# Makes sure you have enough cores free on your system!
# Recommended at least 4 free cores as housekeeping for your oOS!
experiment_cpus: "4-8" # Here I'm leaving 0-3 cores for OS use and cores number above 8

cores:
  # host-side servers are pinned
  server_core_classic: 4
  server_core_l4s: 5
  mahimahi_core: 6
  client_core_classic: 7
  client_core_l4s: 8

traces:
  up: ../traces/Constant.up
  down: ../traces/Constant.down

queue:
  type: dualPI2
  packets: 10000
  target: 15
  tupdate: 16
  alpha: 0.00016
  beta: 0.0032

flows:
  # ports used per-run:
  #   classic port = base_port + 2*idx
  #   l4s    port = base_port + 2*idx + 1
  base_port: 5300

  classic:
    # classic is UDP
    rate: "12M"
    packet_len: 1200
    tos: 0          # Not-ECT

  l4s:
    # l4s is TCP (Prague assumed set globally via sysctl before running)
    tos: 1          # ECT(1)
    cc: prague
