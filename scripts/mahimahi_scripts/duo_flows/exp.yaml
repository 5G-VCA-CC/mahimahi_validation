# exp.yaml (most updated for CONCURRENT classic UDP + l4s TCP)

output_dir: ./outputs

secs_per_run: 30
num_runs: 90

# cpu shielding
housekeeping: "0-3"
experiment_cpus: "4-7"

cores:
  mahi_core: 7

  # two concurrent servers (host side)
  server_core_classic: 5
  server_core_l4s: 6

  # two concurrent clients (inside mm-link)
  client_core_classic: 4
  client_core_l4s: 7

traces:
  up: ../traces/Constant.up
  down: ../traces/Constant.down

queue:
  type: dualPI2
  packets: 20000
  target: 1
  tupdate: 16
  alpha: 0.16
  beta: 3

flows:
  # ports used per-run:
  #   classic port = base_port + 2*idx
  #   l4s    port = base_port + 2*idx + 1
  base_port: 5300

  classic:
    # classic is UDP
    rate: "12M"
    packet_len: 1200
    tos: 0          # Not-ECT

  l4s:
    # l4s is TCP
    tos: 1          # ECT(1)
    cc: prague
