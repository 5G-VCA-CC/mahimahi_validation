# exp_duo.yaml

output_dir: ./outputs

secs_per_run: 30
num_runs: 95

# cpu shielding
housekeeping: "0-3"
experiment_cpus: "4-7"

cores:
  mahi_core: 7
  server_core: 5
  client_core: 6

traces:
  up: ../traces/Constant.up
  down: ../traces/Constant.down

queue:
  type: dualPI2
  packets: 20000
  target: 1
  tupdate: 16
  alpha: 0.16
  beta: 3

flow:
  mode: l4s          # "l4s" or "classic"
  l4s_tos: 1         # ECT(1)
  rate: "12M"        # only used for classic UDP path in this script
  packet_len: 1200   # only used for classic UDP path in this script
  base_port: 5300
