sweep:
  regimes:
    # ===================== Low-BDP (RTT 20ms, BW 12Mbps) =====================
    - name: LowBDP_singleL4S_20ms_12Mbps
      delay_ms: 10
      queue:
        packets: 250
      traces:
        up: ../traces/DSL_12Mbps.up
        down: ../traces/DSL_12Mbps.down
      flows:
        base_port: 5300
        l4s:
          tos: 1
          cc: prague

    - name: LowBDP_singleClassic_20ms_12Mbps
      delay_ms: 10
      queue:
        packets: 250
      traces:
        up: ../traces/DSL_12Mbps.up
        down: ../traces/DSL_12Mbps.down
      flows:
        base_port: 5300
        classic:
          proto: tcp
          tos: 0
          cc: cubic

    - name: LowBDP_dual_20ms_12Mbps
      delay_ms: 10
      queue:
        packets: 250
      traces:
        up: ../traces/DSL_12Mbps.up
        down: ../traces/DSL_12Mbps.down
      flows:
        base_port: 5300
        classic:
          proto: tcp
          tos: 0
          cc: cubic
        l4s:
          tos: 1
          cc: prague

