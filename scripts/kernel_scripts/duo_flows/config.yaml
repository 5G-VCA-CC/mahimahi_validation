# config.yaml

runs:
  secs_per_run: 30
  num_runs: 95
  setup_sec: 3
  warmup_sec: 3
  cooldown_sec: 3

net:
  ns_s: ns_s
  ns_r: ns_r
  veth_dev: veth-s
  dst_ip: 172.20.1.2

  # Two ports so classic UDP + l4s TCP can run AT THE SAME TIME
  port_classic: 5202
  port_l4s: 5203

qdisc:
  rate: 12mbit
  burst: 1k
  target: 1ms
  tupdate: 16ms
  limit: 15040000
  alpha: 0.16
  beta: 3.2

# ✅ Change “flow rate” here:
flows:
  classic:
    # Offered load for UDP flow:
    bandwidth: 12M
    datagram_len: 1200

  l4s:
    # TCP offered-load control is congestion-controlled.
    # If your iperf3 supports it, this sets socket pacing (optional):
    # Examples: "6M", "12M", "20M"
    # Number of parallel TCP streams:
    parallel: 1

logging:
  dir: ./tmp
  qdisc_sample_sec: 0.016
  timeout_extra: 5

cpu:
  housekeeping: "0-3"
  experiment: "4-7"
  logger_core: 3

  # L4S TCP cores
  sender_core_l4s: 4
  receiver_core_l4s: 5

  # classic UDP uses “two extra cores” by default:
  udp_core_offset: 2
  # optional explicit override (otherwise computed as l4s core + offset)
  # sender_core_classic: 6
  # receiver_core_classic: 7
