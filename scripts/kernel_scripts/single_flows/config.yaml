runs:
  secs_per_run: 30
  num_runs: 95
  setup_sec: 3
  warmup_sec: 3
  cooldown_sec: 3

net:
  ns_s: ns_s
  ns_r: ns_r
  veth_dev: veth-s
  dst_ip: 172.20.1.2

  # Single port now (only one iperf server/client pair runs)
  port: 5203

qdisc:
  rate: 12mbit
  burst: 1k
  target: 1ms
  tupdate: 16ms
  limit: 15040000
  alpha: 0.16
  beta: 3.2

flows:
  # ✅ PICK ONE: "classic" or "l4s"
  mode: l4s

  classic:
    # UDP offered load settings (used only when mode=classic)
    bandwidth: 12M
    datagram_len: 1200
    tos: "0x00"   # Not-ECT

  l4s:
    # TCP Prague settings (used only when mode=l4s)
    parallel: 1
    tos: "0x01"   # ECT(1)

logging:
  dir: ./tmp
  qdisc_sample_sec: 0.016
  timeout_extra: 5

cpu:
  housekeeping: "0-3"
  experiment: "4-7"
  logger_core: 3

  # Single flow => single sender/receiver core pair
  sender_core: 4
  receiver_core: 5
